plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.salehilove.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.salehilove.app'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
        vectorDrawables.useSupportLibrary = true
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { compose true }
    composeOptions { kotlinCompilerExtensionVersion '1.5.8' }
    packaging {
        resources.excludes += '/META-INF/{AL2.0,LGPL2.1}'
    }
    lint {
        abortOnError false
    }
}


// Package the verified HAvoice instructor portrait as a local Android resource.
// The committed Base64 source keeps the image available without any network at runtime.
def salehiPortraitSource = rootProject.file('art/salehi_portrait.jpg.b64')
def salehiBrandResDir = file("$buildDir/generated/res/salehiBrand")
def salehiPortraitOutput = new File(salehiBrandResDir, 'drawable-nodpi/salehi_portrait.jpg')

android.sourceSets.main.res.srcDir(salehiBrandResDir)

tasks.register('prepareSalehiBrandAsset') {
    inputs.file(salehiPortraitSource)
    outputs.file(salehiPortraitOutput)
    doLast {
        if (!salehiPortraitSource.isFile()) {
            throw new GradleException('Missing verified brand photo: ' + salehiPortraitSource)
        }
        salehiPortraitOutput.parentFile.mkdirs()
        def encodedPhoto = salehiPortraitSource.getText('UTF-8').replaceAll(/\s+/, '')
        salehiPortraitOutput.bytes = java.util.Base64.getDecoder().decode(encodedPhoto)
    }
}
tasks.named('preBuild').configure {
    dependsOn(tasks.named('prepareSalehiBrandAsset'))
}

apply from: "$rootDir/scripts/offline-conventions.gradle"

dependencies {
    implementation project(':core:common')
    implementation project(':core:designsystem')
    implementation project(':core:database')
    implementation project(':core:security')
    implementation project(':feature:learning')
    implementation project(':feature:personal')
    implementation project(':feature:planner')
    implementation project(':feature:backup')

    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.22'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
}
