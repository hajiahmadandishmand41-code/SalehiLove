plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.salehilove.core.designsystem'
    compileSdk 35

    defaultConfig {
        minSdk 26
        consumerProguardFiles 'consumer-rules.pro'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.8'
    }
}

apply from: "$rootDir/scripts/offline-conventions.gradle"

dependencies {
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.22'
    api 'androidx.compose.ui:ui:1.6.3'
    api 'androidx.compose.foundation:foundation:1.6.3'
    api 'androidx.compose.material3:material3:1.2.1'
    api 'androidx.compose.material:material-icons-core:1.6.3'
    api 'androidx.compose.material:material-icons-extended:1.6.3'
    implementation 'androidx.activity:activity-compose:1.8.2'
    // Pins the coroutines graph at 1.7.3 (compose 1.6.3 asks for 1.7.1, absent
    // from the offline mirror; 1.7.3 is a compatible newer drop).
    api 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    testImplementation 'junit:junit:4.13.2'
}
