plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.salehilove.core.designsystem'
    compileSdk 35

    defaultConfig {
        minSdk 26
        consumerProguardFiles 'consumer-rules.pro'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

apply from: "$rootDir/scripts/offline-conventions.gradle"

dependencies {
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.22'
    api 'androidx.compose.ui:ui:1.6.3'
    api 'androidx.compose.foundation:foundation:1.6.3'
    api 'androidx.compose.material3:material3:1.2.1'
    api 'androidx.compose.material:material-icons-core:1.6.3'
    implementation 'androidx.core:core-ktx:1.12.0'
}
